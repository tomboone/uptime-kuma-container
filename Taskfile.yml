version: "3"

# Run on kumadrome, from ~/kuma-personal. See README.md.
tasks:
  up:
    desc: Start or update the stack
    cmds:
      - docker compose up -d

  ps:
    desc: Show container state and health
    cmds:
      - docker compose ps

  logs:
    desc: Tail Kuma's logs
    cmds:
      - docker compose logs -f uptime-kuma

  upgrade:
    desc: Pull new images and recreate (take a backup first, see README)
    cmds:
      - git pull
      - docker compose pull
      - docker compose up -d
      - docker image prune -f
